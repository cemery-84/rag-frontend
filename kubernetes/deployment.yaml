apiVersion: apps/v1
kind: Deployment
metadata:
    name: rag-frontend
    labels:
        app: rag-frontend
spec:
    replicas: 2
    selector:
        matchLabels:
            app: rag-frontend
    template:
        metadata:
            labels:
                app: rag-frontend
        spec:
            containers:
                - name: rag-frontend
                  image: aichatappcontainer.azurecr.io/rag-frontend:v1
                  ports:
                      - containerPort: 80
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '128Mi'
                      limits:
                          cpu: '250m'
                          memory: '256Mi'
